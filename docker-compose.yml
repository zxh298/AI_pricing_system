# Local stack. Same images/env-var contract as Cloud Run; only values differ.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
      POSTGRES_DB: pricing
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 3s
      timeout: 3s
      retries: 15

  mock-sap:
    build:
      context: .
      dockerfile: services/mock_sap/Dockerfile
    environment:
      PORT: "8001"
      DATABASE_URL: postgresql://pricing:pricing@postgres:5432/pricing
      SAP_READ_KEY: ${SAP_READ_KEY:-dev-read-key}
      SAP_WRITE_KEY: ${SAP_WRITE_KEY:-dev-write-key}
      # fault injection, off by default (restart the container to change):
      SAP_FAULT_FAIL_FIRST_N: ${SAP_FAULT_FAIL_FIRST_N:-0}
      SAP_FAULT_429_RATE: ${SAP_FAULT_429_RATE:-0}
      SAP_FAULT_5XX_RATE: ${SAP_FAULT_5XX_RATE:-0}
      SAP_FAULT_SEED: ${SAP_FAULT_SEED:-1}
      SAP_FAULT_RETRY_AFTER: ${SAP_FAULT_RETRY_AFTER:-1}
    ports: ["8001:8001"]
    depends_on:
      postgres: {condition: service_healthy}

  diagnostic-api:
    build:
      context: .
      dockerfile: services/diagnostic_api/Dockerfile
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://pricing:pricing@postgres:5432/pricing
      SAP_BASE_URL: http://mock-sap:8001
      SAP_READ_KEY: ${SAP_READ_KEY:-dev-read-key}   # never SAP_WRITE_KEY: this service cannot change a price
      DUCKDB_PATH: /data/warehouse.duckdb
      LLM_PROVIDER: ${LLM_PROVIDER:-scripted}       # scripted needs no key; anthropic needs ANTHROPIC_API_KEY below
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    ports: ["8000:8000"]
    volumes: ["./data:/data:ro"]                    # read-only: the warehouse is written only by weekly-pipeline
    depends_on:
      postgres: {condition: service_healthy}
      mock-sap: {condition: service_started}

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    environment:
      PORT: "8501"
      DIAGNOSTIC_API_URL: http://diagnostic-api:8000
    ports: ["8501:8501"]
    depends_on:
      diagnostic-api: {condition: service_started}

  # Batch job: docker compose run --rm weekly-pipeline --week 2026-W39
  weekly-pipeline:
    profiles: [jobs]
    build:
      context: .
      dockerfile: jobs/weekly_pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql://pricing:pricing@postgres:5432/pricing
      SAP_BASE_URL: http://mock-sap:8001
      SAP_READ_KEY: ${SAP_READ_KEY:-dev-read-key}
      SAP_WRITE_KEY: ${SAP_WRITE_KEY:-dev-write-key}
      DUCKDB_PATH: /data/warehouse.duckdb     # BigQuery on GCP (WAREHOUSE=bigquery)
    volumes: ["./data:/data"]
    depends_on:
      mock-sap: {condition: service_started}

volumes:
  pgdata:
